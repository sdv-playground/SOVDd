[package]
name = "sovd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core traits and types for SOVD servers"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
bytes.workspace = true
futures-core = "0.3"
# OpenAPI schema derives, feature-gated + default-off (additive): lets an
# embedding server generate an OpenAPI 3.1 document that reuses these wire
# types. Nothing in the default build depends on it.
utoipa = { version = "5", optional = true, features = ["chrono"] }

[features]
openapi = ["dep:utoipa"]
